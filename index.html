<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Призрачный Лаунчер — Mimilow Island</title>
    <!-- Надежное подключение Supabase -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; background: #243328; color: #E0FFE6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: #32824D; padding: 30px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 320px; border: 2px solid #52DD6A; text-align: center; }
        h2 { margin-top: 0; color: #E0FFE6; text-shadow: 0 0 10px rgba(82, 221, 106, 0.6); margin-bottom: 5px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #243328; background: #1c2620; color: #52DD6A; border-radius: 5px; box-sizing: border-box; font-weight: bold; }
        input::placeholder { color: #4a6352; }
        button { width: 100%; padding: 12px; background: #52DD6A; border: none; color: #243328; font-weight: bold; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #E0FFE6; box-shadow: 0 0 15px #52DD6A; }
        .sub-btn { width: 100%; padding: 12px; background: #1c2620; color: #52DD6A; border: 1px solid #243328; font-size: 13px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .sub-btn:hover { background: #243328; color: #E0FFE6; }
        .message { margin-top: 15px; text-align: center; font-size: 15px; font-weight: bold; padding: 12px; border-radius: 5px; line-height: 1.4; display: none; background: rgba(0,0,0,0.3); border: 1px solid #ff6666; color: #ff6666; }
        .hint { font-size: 11px; color: #b3ffd1; text-align: center; margin-bottom: 15px; line-height: 1.3; }
    </style>
</head>
<body>

<div class="form-container" id="formBox">
    <h2 id="formTitle">Призрачный Лаунчер</h2>
    <div id="formHint" class="hint">Пароль от 4 знаков! Для создания аккаунта заполни инвайт. Для входа — только Ник и Пароль. 🎁</div>
    
    <div id="inputsBlock">
        <input type="text" id="username" placeholder="Игровой Никнейм" required oninput="saveFields()">
        <input type="password" id="password" placeholder="Пароль для входа" required oninput="saveFields()">
        <input type="email" id="email" placeholder="Твоя Почта (Необязательно)" oninput="saveFields()">
        <input type="text" id="invite" placeholder="Уникальный инвайт-код (Для создания акка)" oninput="saveFields()">
    </div>

    <button id="mainBtn" onclick="handleAuth()">Зарегистрироваться</button>
    <button id="toggleBtn" class="sub-btn" onclick="toggleMode()">Я уже мышка, войти!</button>

    <div class="message" id="msg"></div>
</div>

<script>
    const SUPABASE_URL = "https://supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_TdTkz8-C0uMkfQeAsGOF1Q_zIQlIulo";
    
    const BAD_WORDS = ["хуй", "пизд", "ебл", "еба", "сук", "бля", "говн", "трах", "член", "гандон", "залуп", "sex", "fuck", "письк"];
    const ALLOWED_INVITES = ["SPOOKY2026", "MIMILOW1", "GHOST77", "4ef386ef", "HALLOWEEN"];
    
    let isLoginMode = false;
    let supabase = null;

    try {
        if (window.supabase) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
    } catch (e) { console.error(e); }

    function loadSavedFields() {
        if (localStorage.getItem('mimi_username')) document.getElementById('username').value = localStorage.getItem('mimi_username');
        if (localStorage.getItem('mimi_password')) document.getElementById('password').value = localStorage.getItem('mimi_password');
        if (localStorage.getItem('mimi_email')) document.getElementById('email').value = localStorage.getItem('mimi_email');
        if (localStorage.getItem('mimi_invite')) document.getElementById('invite').value = localStorage.getItem('mimi_invite');
    }
    
    window.addEventListener('DOMContentLoaded', loadSavedFields);
    setTimeout(loadSavedFields, 100);

    function saveFields() {
        localStorage.setItem('mimi_username', document.getElementById('username').value);
        localStorage.setItem('mimi_password', document.getElementById('password').value);
        localStorage.setItem('mimi_email', document.getElementById('email').value);
        localStorage.setItem('mimi_invite', document.getElementById('invite').value);
    }

    function toggleMode() {
        const emailField = document.getElementById('email');
        const inviteField = document.getElementById('invite');
        const mainBtn = document.getElementById('mainBtn');
        const toggleBtn = document.getElementById('toggleBtn');
        const msgDiv = document.getElementById('msg');
        
        if (msgDiv) msgDiv.style.display = "none";

        if (!isLoginMode) {
            isLoginMode = true;
            emailField.style.display = "none";
            inviteField.style.display = "none";
            mainBtn.innerText = "Войти в игру!";
            toggleBtn.innerText = "Хочу создать аккаунт";
        } else {
            isLoginMode = false;
            emailField.style.display = "block";
            inviteField.style.display = "block";
            mainBtn.innerText = "Зарегистрироваться";
            toggleBtn.innerText = "Я уже мышка, войти!";
        }
    }

    async function handleAuth() {
        const msgDiv = document.getElementById('msg');
        const mainBtn = document.getElementById('mainBtn');

        if (!supabase) {
            msgDiv.style.display = "block";
            msgDiv.innerText = "❌ База данных не подключена. Обновите страницу через Ctrl+F5.";
            return;
        }

        // Кнопка мгновенно реагирует на клик
        mainBtn.disabled = true;
        mainBtn.style.background = "#ffcc00";
        mainBtn.style.color = "#000";
        mainBtn.innerText = "⚡ ОТПРАВЛЯЮ ДАННЫЕ...";
        msgDiv.style.display = "none";

        if (isLoginMode) {
            await loginUser();
        } else {
            await registerUser();
        }
    }

    async function registerUser() {
        const username = document.getElementById('username').value.trim();
        let email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const invite = document.getElementById('invite').value.trim();
        const msgDiv = document.getElementById('msg');
        const mainBtn = document.getElementById('mainBtn');

        if (!username || !password || !invite) {
            showError("❌ Ошибка: Заполни все поля!");
            return;
        }
        if (password.length < 4) {
            showError("❌ Ошибка: Пароль должен быть от 4 знаков!");
            return;
        }

        const lowerUsername = username.toLowerCase();
        for (let word of BAD_WORDS) {
            if (lowerUsername.includes(word)) {
                showError("🛑 Ошибка: Ник содержит запрещенные слова!");
                return;
            }
        }

        if (!ALLOWED_INVITES.includes(invite)) {
            showError("❌ Ошибка: Неверный инвайт-код!");
            return;
        }

        if (!email) {
            email = `${username.toLowerCase()}@mimilow.fake`;
        }

        let finalPassword = password.length < 6 ? password + "_mimilow_child_secure" : password;

        const { data, error } = await supabase.auth.signUp({
            email: email,
            password: finalPassword,
            options: { data: { display_name: username } }
        });

        if (error) {
            showError("❌ Ошибка сервера: " + error.message);
            return;
        }

        showSuccess();
    }

    async function loginUser() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) {
            showError("❌ Ошибка: Введи Ник и Пароль!");
            return;
        }

        let email = `${username.toLowerCase()}@mimilow.fake`;
        let finalPassword = password.length < 6 ? password + "_mimilow_child_secure" : password;

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: finalPassword
        });

        if (error) {
            showError("❌ Неверный ник или пароль!");
            return;
        }

        showSuccess();
    }

    function showError(text) {
        const msgDiv = document.getElementById('msg');
        const mainBtn = document.getElementById('mainBtn');
        
        mainBtn.disabled = false;
        mainBtn.style.background = "#52DD6A";
        mainBtn.style.color = "#243328";
        mainBtn.innerText = isLoginMode ? "Войти в игру!" : "Зарегистрироваться";
        
        msgDiv.style.display = "block";
        msgDiv.innerText = text;
    }

    function showSuccess() {
        localStorage.clear();
        // Полностью перерисовываем окно на огромный текст успеха
        document.getElementById('formBox').innerHTML = `
            <h1 style="color: #52DD6A; text-shadow: 0 0 15px #52DD6A; font-size: 26px; margin-bottom: 15px;">🎉 АККАУНТ УСПЕШНО СОЗДАН!</h1>
            <p style="color: #E0FFE6; font-size: 16px; font-weight: bold; line-height: 1.5;">Теперь ты официальная мышка Mimilow Island! 🎁<br>Можешь закрывать страницу.</p>
            <button onclick="window.location.reload()" style="background: #1c2620; color: #52DD6A; border: 1px solid #52DD6A; margin-top: 20px;">Создать ещё один аккаунт</button>
        `;
    }
</script>
</body>
</html>
